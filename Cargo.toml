[package]
name = "AudioDownloader"
version = "0.1.0"
edition = "2021"

[package.metadata.bundle]
name = "AudioDownloader"
identifier = "com.AudioDownloader.app"
icon = ["assets/AudioDownloader_icon.png"]
category = "Utility"
short_description = "A GUI app that downloads audio from YouTube."
long_description = "A GUI app that downloads audio from YouTube with playlist support, clipboard monitoring, and multiple format options."

[dependencies]
eframe = "0.31"
rfd = "0.15"
arboard = { version = "3", features = ["wayland-data-control"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"

[profile.release]
opt-level = 3
lto = true
strip = true